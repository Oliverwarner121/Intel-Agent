name: Dependency update report

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Informational dependency report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      # Only execute trusted base-commit code. PR manifests are fetched as JSON data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { report } = require("./.github/scripts/dependency-report.cjs");
            await report({ github, context, core });
